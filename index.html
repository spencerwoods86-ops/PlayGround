<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a2e">
<title>Rust &amp; Rumble — Factory Run</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#101a2e;color:#f5e8bd}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#263650 0,#111b2f 65%,#0b1322 100%);overflow:hidden}.shell{width:min(100vw,1180px);padding:10px 14px 14px}.top{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(14px,2.4vw,20px);font-weight:900;letter-spacing:1.6px;color:#ffe7a2;text-shadow:2px 2px #8c4d39}.brand span{color:#70e1c0}.badge{color:#9eb3c8;font-size:10px;letter-spacing:1.2px}.restart{font:700 11px inherit;color:#f9e9bd;background:#26344a;border:2px solid #53667c;padding:8px 11px;border-radius:4px;cursor:pointer;box-shadow:0 3px #111a2a}.restart:active{transform:translateY(2px);box-shadow:none}.frame{position:relative;width:100%;aspect-ratio:16/9;border:4px solid #43556a;background:#192a3c;box-shadow:0 0 0 3px #111a2a,0 16px 50px #0009;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 3px 4px;color:#adc1ce;font-size:11px}.objective{color:#f4df9b}.key{display:inline-block;padding:2px 5px;border:1px solid #65768a;border-radius:3px;color:#fff4ce;background:#27384a;margin:0 2px}.touch{display:none;position:absolute;inset:auto 0 10px;justify-content:space-between;padding:0 12px;pointer-events:none}.cluster{display:flex;gap:8px;align-items:end}.tbtn{pointer-events:auto;width:54px;height:54px;border:2px solid #c9d3ca99;border-radius:50%;background:#17283dcc;color:#fff5d5;font:900 20px inherit;box-shadow:0 3px #101a2a;touch-action:none;user-select:none;-webkit-user-select:none}.tbtn.action{width:63px;height:63px;font-size:12px;border-radius:18px;color:#a6f2d2}.tbtn.jump{color:#ffe49d}.tbtn:active,.tbtn.down{background:#617b79dd;transform:translateY(2px)}.mobile-hint{display:none;font-size:9px;color:#91a9b7}.footer{font-size:9px;color:#71869b;text-align:center;padding-top:5px}@media(max-width:700px){.shell{padding:5px;width:100vw}.top{height:36px}.badge{display:none}.hud{padding:7px 2px 2px;font-size:9px}.desktop-hint{display:none}.mobile-hint{display:block}.touch{display:flex}.frame{border-width:3px}.restart{padding:6px 8px;font-size:10px}}@media(orientation:portrait) and (max-width:700px){.shell{transform:translateY(-3vh)}.frame{aspect-ratio:4/3}.touch{bottom:8px}.tbtn{width:48px;height:48px}.tbtn.action{width:56px;height:56px}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand">RUST <span>&amp;</span> RUMBLE</div><div class="badge">● FACTORY RUN &nbsp; / &nbsp; STAGE 01</div><button class="restart" id="restart">↻ RESTART</button></header><div class="frame"><canvas id="game" aria-label="Rust and Rumble side scrolling puzzle platformer"></canvas><div class="touch"><div class="cluster"><button class="tbtn" data-hold="left" aria-label="Move left">◀</button><button class="tbtn" data-hold="right" aria-label="Move right">▶</button></div><div class="cluster"><button class="tbtn action" data-tap="interact" aria-label="Pick up or throw">GRAB<br> / THROW</button><button class="tbtn jump" data-hold="jump" aria-label="Jump">▲</button></div></div></div><div class="hud"><div class="objective" id="objective">① Tip the seesaw. ② Weigh down the pressure plate.</div><div class="desktop-hint"><span class="key">←</span><span class="key">→</span> move &nbsp;<span class="key">SPACE</span> jump &nbsp;<span class="key">E</span> grab / throw</div><div class="mobile-hint">Use the on-screen controls</div></div><div class="footer">A LITTLE MOMENTUM GOES A LONG WAY &nbsp; · &nbsp; R TO RESTART</div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),objective=document.getElementById('objective');
const W=480,H=270,levelW=1940,ground=238;canvas.width=W;canvas.height=H;
const keys={left:false,right:false,jump:false},solids=[],objects=[];let player,cam=0,beam={x:770,y:203,angle:0,omega:0,length:150},gateOpen=false,bridgeOpen=false,won=false,notice='',noticeTime=0;
const platforms=[{x:0,y:238,w:630,h:60},{x:900,y:238,w:570,h:60},{x:1600,y:238,w:340,h:60},{x:280,y:187,w:100,h:10},{x:460,y:157,w:95,h:10},{x:1050,y:190,w:100,h:10},{x:1250,y:160,w:105,h:10},{x:1450,y:198,w:150,h:10},{x:1650,y:184,w:100,h:10}];
function box(x,y,w,h,type,mass,color){return{x,y,w,h,type,mass,color,vx:0,vy:0,onGround:false,held:false,angle:0,spin:0}}
function reset(){objects.length=0;objects.push(box(590,211,38,27,'boulder',3.3,'#b1aa91'),box(690,177,23,23,'crate',1.25,'#d7a24e'),box(1100,211,30,27,'weight',2.1,'#7898a4'),box(1340,211,30,27,'weight',2.1,'#7898a4'),box(1520,211,26,27,'crate',1.3,'#d7a24e'));
player={x:72,y:205,w:17,h:29,vx:0,vy:0,onGround:false,dir:1,held:null,anim:0};beam.angle=0;beam.omega=0;cam=0;gateOpen=false;bridgeOpen=false;won=false;notice='';noticeTime=0;}
reset();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function notify(s){notice=s;noticeTime=150}
function nearest(){let best=null,d=52;for(const o of objects){if(o.held)continue;const q=Math.hypot((o.x+o.w/2)-(player.x+player.w/2),(o.y+o.h/2)-(player.y+player.h/2));if(q<d){best=o;d=q}}return best}
function interact(){if(won)return;if(player.held){let o=player.held;player.held=null;o.held=false;o.x=player.x+player.w/2+player.dir*17-o.w/2;o.y=player.y+8;o.vx=player.dir*5.2+player.vx*.45;o.vy=-2.7;o.spin=player.dir*.12;notify('THROW! Use the arc to reach high ledges.')}else{const o=nearest();if(o){player.held=o;o.held=true;o.vx=0;o.vy=0;notify('CARRIED — tap again to throw.')}else notify('Get closer to an object to grab it.')}}
function keydown(e){if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){if(!keys.jump&&player.onGround){player.vy=-7.6;player.onGround=false}keys.jump=true}if((e.code==='KeyE'||e.code==='KeyX')&&!e.repeat)interact();if(e.code==='KeyR'&&!e.repeat)reset()}
function keyup(e){if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.jump=false}
addEventListener('keydown',keydown);addEventListener('keyup',keyup);document.getElementById('restart').onclick=reset;
for(const b of document.querySelectorAll('[data-hold]')){const k=b.dataset.hold;const down=e=>{e.preventDefault();b.classList.add('down');if(k==='jump'&&!keys.jump&&player.onGround){player.vy=-7.6;player.onGround=false}keys[k]=true};const up=e=>{e.preventDefault();b.classList.remove('down');keys[k]=false};b.addEventListener('pointerdown',down);for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,up)}
document.querySelector('[data-tap=interact]').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function panelCollision(a,prevY){a.onGround=false;for(const p of platforms){if(a.x+a.w>p.x&&a.x<p.x+p.w&&a.y+a.h>=p.y&&prevY+a.h<=p.y+5&&a.vy>=0){a.y=p.y-a.h;a.vy=0;a.onGround=true}}if(bridgeOpen&&a.x+a.w>790&&a.x<900&&a.y+a.h>=202&&prevY+a.h<=205&&a.vy>=0){a.y=202-a.h;a.vy=0;a.onGround=true}if(gateOpen&&a.x+a.w>1468&&a.x<1482&&a.y+a.h>170){/* gate removed */}else if(!gateOpen&&a.x+a.w>1468&&a.x<1482&&a.y+a.h>166){if(a.x<1475)a.x=1468-a.w;else a.x=1482;a.vx=0}}
function plankY(x){const dx=x-beam.x;return beam.y+Math.tan(beam.angle)*dx-5}
function simBeam(){let torque=0;for(const o of objects){if(o.held)continue;let dx=o.x+o.w/2-beam.x,y=plankY(o.x+o.w/2);if(Math.abs(dx)<beam.length/2+o.w/2&&o.y+o.h>=y-2&&o.y+o.h<=y+11&&o.vy>=0){o.y=y-o.h;o.vy=Math.min(0,o.vy);o.onGround=true;torque+=dx*o.mass*.00028;}}
// Player can stand on the seesaw as well; their weight contributes naturally.
const px=player.x+player.w/2,py=plankY(px);if(px>beam.x-beam.length/2&&px<beam.x+beam.length/2&&player.y+player.h>=py-1&&player.y+player.h<=py+12&&player.vy>=0){player.y=py-player.h;player.vy=0;player.onGround=true;torque+=(px-beam.x)*2.1*.00028}
beam.omega=clamp(beam.omega+torque,-.045,.045);beam.omega*=.985;beam.angle=clamp(beam.angle+beam.omega,-.48,.48)}
function physicsBody(a){if(a.held)return;const prevY=a.y;a.vy=Math.min(a.vy+.25,8);a.x+=a.vx;a.y+=a.vy;a.vx*=a.onGround?.84:.995;a.onGround=false;panelCollision(a,prevY);
// Basic wall and object collisions, with a tiny restitution for weighty contact.
for(const p of platforms){if(overlap(a,p)){if(prevY+a.h<=p.y+7&&a.vy>=0){a.y=p.y-a.h;a.vy=0;a.onGround=true}else if(prevY>=p.y+p.h-3&&a.vy<0){a.y=p.y+p.h;a.vy=0}else if(a.x+a.w/2<p.x+p.w/2){a.x=p.x-a.w;a.vx=0}else{a.x=p.x+p.w;a.vx=0}}}
if(a.y+a.h>ground&&a.x<630||a.y+a.h>ground&&a.x>=900&&a.x<1470||a.y+a.h>ground&&a.x>=1600){a.y=ground-a.h;a.vy=0;a.onGround=true}
if(a.x<0){a.x=0;a.vx=0}if(a.x>levelW-a.w){a.x=levelW-a.w;a.vx=0}if(a.y>H+170){a.x=player.x<900?100:1000;a.y=120;a.vx=0;a.vy=0;notify('Back on your feet!')}}
function update(){if(won){draw();requestAnimationFrame(update);return}
let dir=(keys.right?1:0)-(keys.left?1:0);if(dir){player.vx+=dir*.34;player.dir=dir}player.vx=clamp(player.vx,-2.35,2.35);player.vy=Math.min(player.vy+.31,8);const py=player.y;player.x+=player.vx;player.y+=player.vy;player.onGround=false;panelCollision(player,py);
for(const p of platforms){if(overlap(player,p)){if(py+player.h<=p.y+8&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}else if(player.x+player.w/2<p.x+p.w/2){player.x=p.x-player.w;player.vx=0}else{player.x=p.x+p.w;player.vx=0}}}
// floor regions
if(player.y+player.h>ground&&((player.x<630)||(player.x>=900&&player.x<1470)||(player.x>=1600))){player.y=ground-player.h;player.vy=0;player.onGround=true}
player.x=clamp(player.x,0,levelW-player.w);if(player.y>H+150){player.x=80;player.y=120;player.vy=0;notify('Careful around the machinery!')}
if(player.held){const o=player.held;o.x=player.x+player.w/2+player.dir*14-o.w/2;o.y=player.y+4;o.vx=player.vx;o.vy=0}
for(const o of objects)physicsBody(o);simBeam();
// Object-to-object solid contact and momentum transfer.
for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){let a=objects[i],b=objects[j];if(a.held||b.held||!overlap(a,b))continue;const push=Math.min(a.x+a.w-b.x,b.x+b.w-a.x);if(push>0){if(a.y+a.h<=b.y+9){a.y=b.y-a.h;a.vy=Math.min(a.vy,0);a.onGround=true}else if(b.y+b.h<=a.y+9){b.y=a.y-b.h;b.vy=Math.min(b.vy,0);b.onGround=true}else{a.x-=push/2;b.x+=push/2;const v=(a.vx*a.mass+b.vx*b.mass)/(a.mass+b.mass);a.vx=v;b.vx=v}}}
const plate={x:1380,y:226,w:78,h:12};let mass=0;for(const o of objects)if(!o.held&&overlap(o,{x:plate.x,y:plate.y-13,w:plate.w,h:25}))mass+=o.mass;if(mass>=3.0){gateOpen=true}else if(!gateOpen)gateOpen=false;
// The thrown crate landing on the receiver switch raises a short catwalk across the factory trench.
for(const o of objects)if(!o.held&&o.x+o.w>820&&o.x<875&&o.y+o.h>185&&o.y+o.h<220)bridgeOpen=true;
if(player.x>1800&&player.y+player.h<ground+2){won=true;notify('FACTORY ESCAPED!')}
if(noticeTime>0)noticeTime--;cam=clamp(player.x-W*.38,0,levelW-W);objective.textContent=won?'★ FACTORY ESCAPED — NICE WORK!':gateOpen?'② Gate open! Make your way to the glowing exit.':bridgeOpen?'① Catwalk powered! Next: load the pressure plate.':'① Tip the seesaw. ② Weigh down the pressure plate.';draw();requestAnimationFrame(update)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function worldRect(x,y,w,h,c){rect(x-cam,y,w,h,c)}
function draw(){ctx.imageSmoothingEnabled=false;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1d3348');sky.addColorStop(.7,'#405465');sky.addColorStop(1,'#8a8064');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant factory silhouettes, pipes and warm windows
for(let i=0;i<9;i++){let x=((i*137-cam*.22)%640+640)%640-60;rect(x,49,44,138,'#263847');rect(x+7,34,8,17,'#40525a');rect(x+27,23,6,28,'#40525a');for(let j=0;j<4;j++)rect(x+8+(j%2)*19,67+Math.floor(j/2)*24,8,8,'#d8954f44')}
rect(0,181,W,57,'#344658');for(let i=0;i<16;i++){let x=(i*41-cam*.48)%520;rect(x,194,20,3,'#657073');rect(x+13,211,4,12,'#293b49')}
// dangling chains and lamps
for(let x=45;x<W;x+=105){rect(x,0,3,33,'#68716c');rect(x-5,30,13,5,'#e1ae61');rect(x-3,35,9,7,'#ffcc6d')}
// World platforms
for(const p of platforms){const x=p.x-cam;if(x+p.w<0||x>W)continue;rect(x,p.y,p.w,p.h,'#675d50');rect(x,p.y,p.w,5,'#8b8068');for(let tx=x;tx<x+p.w;tx+=24){rect(tx,p.y+9,2,p.h-9,'#514e48');rect(tx+4,p.y+17,13,3,'#756b59')}rect(x,p.y-2,p.w,2,'#b5a078')}
// pit warning stripes
for(let x=630-cam;x<900-cam;x+=12){rect(x,240,7,5,'#d78b47');rect(x+7,240,5,5,'#384149')}
// Catwalk receiver and bridge
worldRect(815,182,64,5,bridgeOpen?'#73d9b2':'#916f4c');worldRect(815,187,4,22,'#69766f');worldRect(875,187,4,22,'#69766f');if(bridgeOpen){worldRect(790,202,110,7,'#51bf9c');for(let x=793;x<900;x+=14)worldRect(x,209,5,3,'#a1f0c5')}else{worldRect(827,169,30,13,'#32443f');worldRect(835,173,14,4,'#e4ad55')}
// Seesaw pivot and dynamically tilting plank
const left=beam.x-beam.length/2,right=beam.x+beam.length/2,ly=plankY(left),ry=plankY(right);ctx.fillStyle='#bd7650';ctx.beginPath();ctx.moveTo(left-cam,ly);ctx.lineTo(right-cam,ry);ctx.lineTo(right-cam,ry+8);ctx.lineTo(left-cam,ly+8);ctx.closePath();ctx.fill();ctx.fillStyle='#f0bd73';ctx.fillRect(left-cam,ly,right-left,2);ctx.fillStyle='#9e553d';ctx.beginPath();ctx.moveTo(beam.x-cam-16,beam.y+4);ctx.lineTo(beam.x-cam+16,beam.y+4);ctx.lineTo(beam.x-cam,beam.y-20);ctx.fill();rect(beam.x-cam-18,beam.y+4,36,4,'#54646a');
// Pressure plate, gate and exit
worldRect(1380,226,78,8,'#a45749');worldRect(1384,226,70,3,'#ee9670');worldRect(1402,217,5,7,'#d2a35c');worldRect(1424,214,5,10,'#d2a35c');worldRect(1445,217,5,7,'#d2a35c');if(!gateOpen){worldRect(1467,165,11,73,'#804e3e');for(let y=169;y<237;y+=12)worldRect(1469,y,7,5,'#d29558');worldRect(1464,162,17,5,'#d6a86a')}else{worldRect(1468,160,8,21,'#456c59');worldRect(1469,163,6,15,'#82d2a1')}
// Exit portal
worldRect(1830,181,54,57,'#324b54');worldRect(1835,184,44,54,'#526f66');worldRect(1841,189,32,49,won?'#f4cb76':'#8ac9a5');worldRect(1847,195,20,43,won?'#fff1a7':'#508b7a');worldRect(1827,176,60,7,'#d7aa62');worldRect(1845,167,24,7,'#f3d37e');worldRect(1849,157,16,6,'#ffeaa1');
// objects
for(const o of objects){if(o.held)continue;let x=o.x-cam;if(x+o.w<-5||x>W+5)continue;if(o.type==='boulder'){ctx.fillStyle=o.color;ctx.beginPath();ctx.ellipse(x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();rect(x+7,o.y+6,10,5,'#d1c8ad');rect(x+24,o.y+13,7,6,'#8a897d');rect(x+7,o.y+20,8,4,'#8c8a7f');rect(x+2,o.y+o.h-4,o.w-4,4,'#807c70')}else{rect(x,o.y,o.w,o.h,o.color);rect(x+2,o.y+2,o.w-4,3,'#f0c779');rect(x+3,o.y+6,3,o.h-8,'#93653d');rect(x+o.w-6,o.y+6,3,o.h-8,'#93653d');rect(x+7,o.y+9,o.w-14,3,'#9b7044');rect(x+2,o.y+o.h-4,o.w-4,3,'#875d3f')}rect(x+2,o.y+2,3,3,'#f5d894')}
// player pixel adventurer
const x=Math.round(player.x-cam),y=Math.round(player.y),run=Math.abs(player.vx)>.3,step=run&&player.onGround?Math.floor(Date.now()/105)%2:0;
// shadow
rect(x+3,y+player.h,12,2,'#1b283c88');
// boots and legs
rect(x+3,y+23+(step?1:0),5,5,'#39485a');rect(x+10,y+23+(step?0:1),5,5,'#39485a');rect(x+2,y+27+(step?0:0),7,2,'#e0a55c');rect(x+10,y+27,7,2,'#e0a55c');
// body coat
rect(x+3,y+13,12,11,'#35a98c');rect(x+1,y+15,3,7,'#25836f');rect(x+13,y+15,4,7,'#25836f');rect(x+7,y+14,4,8,'#f0c45f');rect(x+4,y+22,10,3,'#e4b25c');
// face and hair
rect(x+4,y+5,10,10,'#f0bc83');rect(x+3,y+4,11,5,'#614333');rect(x+2,y+6,4,5,'#614333');rect(x+11,y+9,2,2,'#243444');rect(x+7,y+12,5,2,'#bd715c');rect(x+1,y+8,3,4,'#e3a978');
// scarf
rect(x+13,y+13,5,3,'#e95d54');rect(x+16,y+14,4,3,'#e95d54');
if(player.held){const o=player.held;rect(x+player.dir*10+7,y-5,Math.min(o.w,24),Math.min(o.h,18),o.color);rect(x+player.dir*10+8,y-5,3,3,'#f4d18c')}
// Labels and status
function label(text,x,y,color='#ffe8a6'){ctx.font='7px monospace';ctx.textAlign='center';ctx.fillStyle='#172334';ctx.fillText(text,x+1,y+1);ctx.fillStyle=color;ctx.fillText(text,x,y)}
label('HEAVY',600-cam,199);label('THROW TO RECEIVER',847-cam,160,'#bcebd2');label('WEIGH HERE',1419-cam,207,'#ffe0a2');label('EXIT',1857-cam,151,'#fff0ad');
if(noticeTime>0){ctx.fillStyle='#18273be8';ctx.fillRect(100,14,280,25);ctx.strokeStyle='#e3bd75';ctx.strokeRect(100.5,14.5,279,24);ctx.fillStyle='#fff0c1';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(notice,240,29)}
// objective pins
ctx.fillStyle=bridgeOpen?'#77e4b1':'#f0c66f';ctx.fillRect(10,10,5,5);ctx.fillStyle='#ffe9b0';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(bridgeOpen?'CATWALK ONLINE':'FACTORY // 01',20,16);
}
requestAnimationFrame(update);
})();
</script></body></html>
